<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(${budget.id == null ? 'Add Budget' : 'Edit Budget'}, ~{::div.content})}">
<head>
    <title>Budget</title>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <h1 th:text="${budget.id == null ? 'Add Budget' : 'Edit Budget'}"></h1>
            <a th:href="@{/budgets}" class="btn btn-secondary">Cancel</a>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <form th:action="${budget.id == null} ? @{/budgets/save} : @{/budgets/update/{id}(id=${budget.id})}" th:object="${budget}" method="post">
                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label for="targetAmount">Target Amount</label>
                        <input id="targetAmount" type="number" step="0.01" th:field="*{targetAmount}" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label for="periodType">Period</label>
                        <select id="periodType" th:field="*{periodType}" class="form-control">
                            <option value="WEEKLY">Weekly</option>
                            <option value="MONTHLY">Monthly</option>
                            <option value="YEARLY">Yearly</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category.id" class="form-control">
                        <option value="" th:selected="${budget.category == null || budget.category.id == null}">-- Overall --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${budget.category != null && budget.category.id == cat.id}"></option>
                    </select>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" th:field="*{rollover}" id="rollover" style="width: 18px; height: 18px; accent-color: var(--primary-color);" />
                    <label for="rollover" style="margin-bottom: 0;">Enable rollover (carry over unused amount)</label>
                </div>

                <div style="margin-top: var(--spacing-lg); text-align: right;">
                    <button type="submit" class="btn btn-primary">Save Budget</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
