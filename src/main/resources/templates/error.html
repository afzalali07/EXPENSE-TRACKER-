<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Error</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 16px; }
        .container { padding: 20px; border: 1px solid #ffcccc; background: #fff0f0; border-radius: 8px; }
        .message { color: #b30000; }
        a { color: #007bff; }
    </style>
</head>
<body>
<div class="container">
    <h1>Error</h1>
    <p class="message" th:text="${errorMessage}">An error occurred.</p>
    <a href="/">Return to dashboard</a>
</div>
</body>
</html>
