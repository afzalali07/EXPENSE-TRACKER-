<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(${expense.id == null ? 'Add Expense' : 'Edit Expense'}, ~{::div.content})}">
<head>
    <title>Expense</title>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <h1 th:text="${expense.id == null ? 'Add Expense' : 'Edit Expense'}"></h1>
            <a th:href="@{/expenses}" class="btn btn-secondary">Cancel</a>
        </div>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <form th:action="${expense.id == null} ? @{/expenses/save} : @{/expenses/update/{id}(id=${expense.id})}" th:object="${expense}" method="post" enctype="multipart/form-data">
                
                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input id="title" type="text" th:field="*{title}" placeholder="Dinner, Rent, Fuel" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input id="amount" type="number" step="0.01" th:field="*{amount}" class="form-control" required />
                    </div>
                </div>

                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category.id" class="form-control">
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${expense.category != null && expense.category.id == cat.id}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="paymentMethod">Payment Method</label>
                        <select id="paymentMethod" th:field="*{paymentMethod}" class="form-control">
                            <option value="Cash">Cash</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="UPI">UPI</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label for="expenseDate">Date</label>
                        <input id="expenseDate" type="date" th:field="*{expenseDate}" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label for="tags">Tags</label>
                        <input id="tags" type="text" th:field="*{tags}" placeholder="food, monthly" class="form-control" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" th:field="*{description}" class="form-control"></textarea>
                </div>

                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label for="receiptFile">Receipt / Attachment</label>
                        <input id="receiptFile" type="file" name="receiptFile" class="form-control" style="padding: 0.375rem;" />
                    </div>
                    <div class="form-group">
                        <label for="recurring">Recurring</label>
                        <select id="recurring" th:field="*{recurrenceType}" class="form-control">
                            <option value="NONE">None</option>
                            <option value="DAILY">Daily</option>
                            <option value="WEEKLY">Weekly</option>
                            <option value="MONTHLY">Monthly</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="nextRecurringDate">Next Recurrence Date</label>
                    <input id="nextRecurringDate" type="date" th:field="*{nextRecurringDate}" class="form-control" />
                </div>

                <div style="margin-top: var(--spacing-lg); text-align: right;">
                    <button type="submit" class="btn btn-primary">Save Expense</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
