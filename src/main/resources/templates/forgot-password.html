<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 1.5rem;">Enter your registered email to generate a reset token.</p>
            
            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Generate Reset Token</button>
            </form>
            
            <div th:if="${message}" class="alert alert-success" style="margin-top: 1rem;" th:text="${message}"></div>
            <div th:if="${resetToken}" class="alert alert-info" style="margin-top: 1rem; background-color: #EFF6FF; border: 1px solid #BFDBFE;">
                <p style="margin-bottom: 0.5rem; font-weight: 500;">Reset token:</p>
                <code th:text="${resetToken}" style="display: block; background: white; padding: 0.5rem; border-radius: 4px; border: 1px solid #E5E7EB; word-break: break-all;"></code>
                <p style="margin-top: 0.5rem; font-size: 0.875rem;">Use this on the <a th:href="@{/reset-password}" style="color: var(--primary-color);">reset password</a> page.</p>
            </div>
            
            <div class="auth-footer">
                <p><a th:href="@{/login}">Return to login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
