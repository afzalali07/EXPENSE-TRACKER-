<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Reset Password</h2>
            
            <div th:if="${resetError}" class="alert alert-error" th:text="${resetError}"></div>
            
            <form th:action="@{/reset-password}" method="post">
                <div class="form-group">
                    <label for="token">Reset Token</label>
                    <input id="token" name="token" type="text" th:value="${token}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label for="password">New Password</label>
                    <input id="password" name="password" type="password" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Reset Password</button>
            </form>
            
            <div class="auth-footer">
                <p><a th:href="@{/login}">Back to login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
