<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            
            <div th:if="${registrationError}" class="alert alert-error" th:text="${registrationError}"></div>
            
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" th:field="*{username}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Register</button>
            </form>
            
            <div class="auth-footer">
                <p>Already registered? <a th:href="@{/login}">Sign in here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
