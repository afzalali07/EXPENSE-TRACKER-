<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Edit Expense</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 16px; }
        label { display: block; margin: 8px 0 4px; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 16px; background: #ffc107; color: #212529; border: none; border-radius: 4px; }
        .error { color: red; margin-bottom: 10px; }
    </style>
</head>
<body>
<h1>Edit Expense</h1>
<div th:if="${#fields.hasErrors()}" class="error">
    <p>Please fix the errors below:</p>
    <ul>
        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
    </ul>
</div>
<form th:action="@{'/update/' + ${expense.id}}" method="post" th:object="${expense}">
    <label for="title">Title</label>
    <input id="title" type="text" th:field="*{title}" placeholder="Enter expense title" />

    <label for="category">Category</label>
    <input id="category" type="text" th:field="*{category}" placeholder="Enter category" />

    <label for="amount">Amount</label>
    <input id="amount" type="number" step="0.01" th:field="*{amount}" />

    <label for="expenseDate">Date</label>
    <input id="expenseDate" type="date" th:field="*{expenseDate}" />

    <label for="description">Description</label>
    <textarea id="description" th:field="*{description}" rows="4"></textarea>

    <button type="submit">Update Expense</button>
</form>
<a href="/">Back to Expenses</a>
</body>
</html>
