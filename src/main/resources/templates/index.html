<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Home', ~{::div.content})}">
<head>
    <title>Expense Tracker</title>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <h1>Expense Tracker</h1>
            <div class="action-links">
                <a href="/add" class="btn btn-primary">Add New Expense</a>
            </div>
        </div>

        <div class="card" style="margin-bottom: var(--spacing-xl);">
            <div class="stat-card expense">
                <h3>Total Expenses</h3>
                <div class="value" th:text="'$' + ${totalAmount}">0.00</div>
            </div>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="expense : ${expenses}">
                        <td th:text="${expense.id}"></td>
                        <td th:text="${expense.title}" style="font-weight: 500;"></td>
                        <td>
                            <span class="badge badge-info" th:text="${expense.category}"></span>
                        </td>
                        <td th:text="'$' + ${expense.amount}"></td>
                        <td th:text="${expense.expenseDate}"></td>
                        <td th:text="${expense.description}"></td>
                        <td>
                            <div class="action-links">
                                <a th:href="@{'/edit/' + ${expense.id}}" class="btn btn-sm btn-secondary">Edit</a>
                                <a th:href="@{'/delete/' + ${expense.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this expense?');">Delete</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
