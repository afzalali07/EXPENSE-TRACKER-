<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(${income.id == null ? 'Add Income' : 'Edit Income'}, ~{::div.content})}">
<head>
    <title>Income</title>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <h1 th:text="${income.id == null ? 'Add Income' : 'Edit Income'}"></h1>
            <a th:href="@{/incomes}" class="btn btn-secondary">Cancel</a>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <form th:action="${income.id == null} ? @{/incomes/save} : @{/incomes/update/{id}(id=${income.id})}" th:object="${income}" method="post">
                <div class="form-group">
                    <label for="source">Source</label>
                    <input id="source" type="text" th:field="*{source}" placeholder="Salary, Freelance, Investment" class="form-control" required />
                </div>

                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input id="amount" type="number" step="0.01" th:field="*{amount}" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label for="incomeDate">Date</label>
                        <input id="incomeDate" type="date" th:field="*{incomeDate}" class="form-control" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" th:field="*{type}" class="form-control">
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Investment">Investment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="4" th:field="*{notes}" class="form-control"></textarea>
                </div>

                <div style="margin-top: var(--spacing-lg); text-align: right;">
                    <button type="submit" class="btn btn-primary">Save Income</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
